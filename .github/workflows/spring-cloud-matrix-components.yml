name: Auto Build All Spring Cloud Components (Matrix + Nacos/Eureka Dual Register)
run-name: Build All Spring Cloud Components
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: spring-cloud/spring-cloud-release
  REGISTRY: ghcr.io
  GHCR_PREFIX: pungyoung

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: gateway
            image: spring-cloud-gateway
            artifactId: scg-latest
            mainClass: DemoApplication
            javaFile: DemoApplication.java
            isEurekaServer: false
            dependencies: |
                  <!-- Spring Cloud Gateway Webflux -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-gateway-server-webflux</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-kubernetes-fabric8</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <!-- Nacos Discovery Client -->
                  <dependency>
                      <groupId>com.alibaba.cloud</groupId>
                      <artifactId>spring-cloud-starter-alibaba-nacos-discovery</artifactId>
                  </dependency>
                  <!-- Eureka Client -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>
                  </dependency>
            javaCode: |
                package com.example;
                
                import org.springframework.boot.SpringApplication;
                import org.springframework.boot.autoconfigure.SpringBootApplication;
                import org.springframework.cloud.client.discovery.EnableDiscoveryClient;
                
                @EnableDiscoveryClient
                @SpringBootApplication
                public class DemoApplication {
                    public static void main(String[] args) {
                        SpringApplication.run(DemoApplication.class, args);
                    }
                }
                - name: config-server
                  image: spring-cloud-config
                  artifactId: sc-config-latest
                  mainClass: ConfigServerApplication
                  javaFile: ConfigServerApplication.java
                  isEurekaServer: false
            dependencies: |
                  <!-- Spring Cloud Config Server -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-config-server</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-kubernetes-fabric8</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <!-- Nacos Discovery Client -->
                  <dependency>
                      <groupId>com.alibaba.cloud</groupId>
                      <artifactId>spring-cloud-starter-alibaba-nacos-discovery</artifactId>
                  </dependency>
                  <!-- Eureka Client -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>
                  </dependency>
            javaCode: |
              package com.example;
              
              import org.springframework.boot.SpringApplication;
              import org.springframework.boot.autoconfigure.SpringBootApplication;
              import org.springframework.cloud.client.discovery.EnableDiscoveryClient;
              import org.springframework.cloud.config.server.EnableConfigServer;
              
              @EnableDiscoveryClient
              @EnableConfigServer
              @SpringBootApplication
              public class ConfigServerApplication {
                  public static void main(String[] args) {
                      SpringApplication.run(ConfigServerApplication.class, args);
                  }
              }
              - name: eureka-server
                image: spring-cloud-eureka-server
                artifactId: sc-eureka-server
                mainClass: EurekaServerApplication
                javaFile: EurekaServerApplication.java
                isEurekaServer: true
            dependencies: |
                  <!-- Netflix Eureka Server -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-netflix-eureka-server</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <!-- Nacos Discovery Client (Eureka Server注册到Nacos即可，不需要eureka-client) -->
                  <dependency>
                      <groupId>com.alibaba.cloud</groupId>
                      <artifactId>spring-cloud-starter-alibaba-nacos-discovery</artifactId>
                  </dependency>
            javaCode: |
              package com.example;
              
              import org.springframework.boot.SpringApplication;
              import org.springframework.boot.autoconfigure.SpringBootApplication;
              import org.springframework.cloud.client.discovery.EnableDiscoveryClient;
              import org.springframework.cloud.netflix.eureka.server.EnableEurekaServer;
              
              @EnableDiscoveryClient
              @EnableEurekaServer
              @SpringBootApplication
              public class EurekaServerApplication {
                  public static void main(String[] args) {
                      SpringApplication.run(EurekaServerApplication.class, args);
                  }
              }
              - name: k8s-discovery-server
                image: spring-cloud-k8s-discovery-server
                artifactId: sc-k8s-discovery-server
                mainClass: K8sDiscoveryServerApplication
                javaFile: K8sDiscoveryServerApplication.java
                isEurekaServer: false
            dependencies: |
                  <!-- Spring Cloud K8s Discovery Server -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-kubernetes-discovery-server</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <!-- Nacos Discovery Client -->
                  <dependency>
                      <groupId>com.alibaba.cloud</groupId>
                      <artifactId>spring-cloud-starter-alibaba-nacos-discovery</artifactId>
                  </dependency>
                  <!-- Eureka Client -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>
                  </dependency>
            javaCode: |
              package com.example;
              
              import org.springframework.boot.SpringApplication;
              import org.springframework.boot.autoconfigure.SpringBootApplication;
              import org.springframework.cloud.client.discovery.EnableDiscoveryClient;
              import org.springframework.cloud.kubernetes.discovery.server.EnableKubernetesDiscoveryServer;
              
              @EnableDiscoveryClient
              @EnableKubernetesDiscoveryServer
              @SpringBootApplication
              public class K8sDiscoveryServerApplication {
                  public static void main(String[] args) {
                      SpringApplication.run(K8sDiscoveryServerApplication.class, args);
                  }
              }
              - name: function-admin
                image: spring-cloud-function-admin
                artifactId: sc-function-admin
                mainClass: FunctionAdminApplication
                javaFile: FunctionAdminApplication.java
                isEurekaServer: false
            dependencies: |
                  <!-- Spring Cloud Function Admin -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-function-admin</artifactId>
                  </dependency>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-actuator</artifactId>
                  </dependency>
                  <!-- Nacos Discovery Client -->
                  <dependency>
                      <groupId>com.alibaba.cloud</groupId>
                      <artifactId>spring-cloud-starter-alibaba-nacos-discovery</artifactId>
                  </dependency>
                  <!-- Eureka Client -->
                  <dependency>
                      <groupId>org.springframework.cloud</groupId>
                      <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>
                  </dependency>
            javaCode: |
              package com.example;
              
              import org.springframework.boot.SpringApplication;
              import org.springframework.boot.autoconfigure.SpringBootApplication;
              import org.springframework.cloud.client.discovery.EnableDiscoveryClient;
              import org.springframework.cloud.function.admin.EnableFunctionAdmin;
              
              @EnableDiscoveryClient
              @EnableFunctionAdmin
              @SpringBootApplication
              public class FunctionAdminApplication {
                  public static void main(String[] args) {
                      SpringApplication.run(FunctionAdminApplication.class, args);
                  }
              }

    steps:
      - name: Checkout repo (per component last_release file)
        uses: actions/checkout@v5

      - name: Fetch latest Spring Cloud Release Train
        id: get_release
        run: |
          RESP=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
          RAW_TAG=$(echo "$RESP" | jq -r '.tag_name')
          IS_PRE=$(echo "$RESP" | jq -r '.prerelease')
          LATEST_TAG=$(echo "$RAW_TAG" | sed 's/^v//')
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRE}" >> $GITHUB_OUTPUT
          echo "Raw tag: ${RAW_TAG}, cleaned version: ${LATEST_TAG}"

      - name: Skip pre-release / milestone
        if: steps.get_release.outputs.is_prerelease == 'true'
        run: |
          echo "Skip pre-release version: ${{ steps.get_release.outputs.latest_tag }}"
          exit 0

      - name: Read last built version for ${{ matrix.component.name }}
        id: read_last
        run: |
          LAST_FILE="last_release_${{ matrix.component.name }}.txt"
          if [ -f "${LAST_FILE}" ]; then
            LAST=$(cat "${LAST_FILE}")
          else
            LAST=""
          fi
          echo "last=${LAST}" >> $GITHUB_OUTPUT
          echo "Component: ${{ matrix.component.name }} | Last built: ${LAST}, New remote: ${{ steps.get_release.outputs.latest_tag }}"

      - name: Skip build if no new release for ${{ matrix.component.name }}
        if: steps.get_release.outputs.latest_tag == steps.read_last.outputs.last
        run: |
          echo "No new Spring Cloud release for ${{ matrix.component.name }}, skip build."
          exit 0

      - name: Generate project files for ${{ matrix.component.name }}
        run: |
          cat > pom.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
          
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>4.0.7</version>
                  <relativePath/>
              </parent>
          
              <groupId>com.example</groupId>
              <artifactId>${{ matrix.component.artifactId }}</artifactId>
              <version>${{ steps.get_release.outputs.latest_tag }}</version>
          
              <properties>
                  <java.version>23</java.version>
                  <spring-cloud.version>${{ steps.get_release.outputs.latest_tag }}</spring-cloud.version>
              </properties>
          
              <dependencies>
                  ${{ matrix.component.dependencies }}
              </dependencies>
          
              <dependencyManagement>
                  <dependencies>
                      <dependency>
                          <groupId>org.springframework.cloud</groupId>
                          <artifactId>spring-cloud-dependencies</artifactId>
                          <version>\${spring-cloud.version}</version>
                          <type>pom</type>
                          <scope>import</scope>
                      </dependency>
                  </dependencies>
              </dependencyManagement>
          
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
          mkdir -p src/main/java/com/example
          cat > src/main/java/com/example/${{ matrix.component.javaFile }} <<EOF
          ${{ matrix.component.javaCode }}
          EOF
          # 生成 application.yml 配置
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml <<EOF
          server:
            port: 8080
          spring:
            application:
              name: ${{ matrix.component.name }}
            cloud:
              # Nacos 注册中心
              nacos:
                discovery:
                  server-addr: \${NACOS_SERVER_ADDR:127.0.0.1:8848}
                  enabled: \${NACOS_DISCOVERY_ENABLE:true}
              # Eureka 客户端配置（Eureka Server不生效）
              eureka:
                client:
                  serviceUrl:
                    defaultZone: \${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/}
                  enabled: \${EUREKA_CLIENT_ENABLE:true}
          # Eureka Server 专用配置
          eureka:
            instance:
              hostname: localhost
            client:
              registerWithEureka: ${{ matrix.component.isEurekaServer == true && 'false' || 'true' }}
              fetchRegistry: ${{ matrix.component.isEurekaServer == true && 'false' || 'true' }}
            server:
              waitTimeInMsWhenSyncEmpty: 0
          # actuator 暴露端点
          management:
            endpoints:
              web:
                exposure:
                  include: health,info
          EOF
          # 分层Dockerfile
          cat > Dockerfile <<EOF
          FROM eclipse-temurin:23-jdk-noble AS builder
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN java -Djarmode=layertools -jar app.jar extract
          
          FROM eclipse-temurin:23-jre-noble
          WORKDIR /app
          COPY --from=builder app/dependencies/ ./
          COPY --from=builder app/spring-boot-loader/ ./
          COPY --from=builder app/snapshot-dependencies/ ./
          COPY --from=builder app/application/ ./
          ENTRYPOINT ["java", "org.springframework.boot.loader.launch.JarLauncher"]
          EOF

      - name: Setup JDK23 + Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Maven package
        run: mvn clean package -DskipTests

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image ${{ matrix.component.image }}
        run: |
          IMAGE_TAG=${{ steps.get_release.outputs.latest_tag }}
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.GHCR_PREFIX }}/${{ matrix.component.image }}:${IMAGE_TAG}"
          docker build -t ${IMAGE_FULL} .
          docker push ${IMAGE_FULL}

      - name: Save built version marker ${{ matrix.component.name }}
        run: |
          LAST_FILE="last_release_${{ matrix.component.name }}.txt"
          echo ${{ steps.get_release.outputs.latest_tag }} > ${LAST_FILE}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${LAST_FILE}
          git commit -m "Build ${{ matrix.component.image }} ${{ steps.get_release.outputs.latest_tag }} (matrix auto track + nacos/eureka register)"
          git push
